<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>צמיחה</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1 id="pageTitle">היום</h1>
      <p id="pageSub" class="sub"></p>
    </div>
    <button id="btnBackup" class="icon-btn" aria-label="גיבוי ושחזור">⚙️</button>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="today" class="active"><span>🌅</span>היום</button>
    <button data-tab="habits"><span>🔁</span>הרגלים</button>
    <button data-tab="goals"><span>🎯</span>מטרות</button>
    <button data-tab="focus"><span>⏱️</span>פוקוס</button>
    <button data-tab="home"><span>🏠</span>בית</button>
    <button data-tab="learn"><span>💡</span>ידע</button>
  </nav>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card" id="modalCard"></div>
  </div>
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
